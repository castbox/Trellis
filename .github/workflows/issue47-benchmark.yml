name: Issue 47 controlled performance

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - '.trellis/tasks/10-17-issue-47-snapshot-hash-reuse/research/benchmark/paired-protocol-ci.json'

permissions:
  contents: read

concurrency:
  group: issue47-benchmark-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  registration:
    if: github.event.pull_request.number == 50 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      registered: ${{ steps.registration.outputs.registered }}
    steps:
      - name: Read the exact candidate registration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Run only a newly committed registration
        id: registration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          path = '.trellis/tasks/10-17-issue-47-snapshot-hash-reuse/research/benchmark/paired-protocol-ci.json'
          protocol = json.loads(Path(path).read_text())
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          changed = subprocess.check_output(['git', 'log', '-1', '--format=%H', '--', path], text=True).strip()
          registered = parent == protocol['registration_parent'] and changed == head
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('registered=' + str(registered).lower() + '\n')
          print('New cohort registration:', registered)
          PY

  benchmark:
    needs: registration
    if: needs.registration.outputs.registered == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LC_ALL: C
      LANG: C
      ISSUE47_RESULTS: /tmp/trellis-issue47-ci-results
      ISSUE47_EXPORTS: /tmp/trellis-issue47-ci-exports
    steps:
      - name: Reject retries of an accepted-sample cohort
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir "$ISSUE47_RESULTS"
          printf 'run_id=%s\nrun_attempt=%s\nhead=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "${{ github.event.pull_request.head.sha }}" > "$ISSUE47_RESULTS/workflow-identity.txt"

      - name: Checkout the exact preregistered candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout the pinned public consumer source
        uses: actions/checkout@v4
        with:
          repository: castbox/guru-trellis
          ref: f70b64b026725b27d59fed17ed710cc2f831439f
          path: .benchmark-sources/guru
          persist-credentials: false

      - name: Set up the frozen Python version
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'

      - name: Prepare isolated exports and original fixture path resolution
        shell: bash
        run: |
          set -euo pipefail
          benchmark=.trellis/tasks/10-17-issue-47-snapshot-hash-reuse/research/benchmark
          test ! -e /var/folders
          test ! -L /var/folders
          sudo install -d -o "$(id -u)" -g "$(id -g)" /private/var/folders/rd/kbzpxp956nb3p_h04vnfg3l80000gn/T
          sudo ln -s /private/var/folders /var/folders
          python "$benchmark/prepare_exports.py" --guru .benchmark-sources/guru --fork . --destination "$ISSUE47_EXPORTS/before"
          python "$benchmark/prepare_after_projection.py" --guru .benchmark-sources/guru --destination "$ISSUE47_EXPORTS/after/guru"
          git diff --exit-code -- "$benchmark/isolated-consumer-projection.patch" "$benchmark/isolated-consumer-projection-checksums.json"

      - name: Run the single complete preregistered paired cohort
        shell: bash
        run: |
          set -euo pipefail
          benchmark=.trellis/tasks/10-17-issue-47-snapshot-hash-reuse/research/benchmark
          python "$benchmark/ci_cohort.py" \
            --protocol "$benchmark/paired-protocol-ci.json" \
            --output "$ISSUE47_RESULTS" \
            --before-guru "$ISSUE47_EXPORTS/before/guru" \
            --after-guru "$ISSUE47_EXPORTS/after/guru" \
            --before-common "$ISSUE47_EXPORTS/before/fork/.trellis/scripts/common" \
            --after-common "$GITHUB_WORKSPACE/.trellis/scripts/common"

      - name: Preserve all results, including incomplete or failed cohorts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue47-ci-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: |
            /tmp/trellis-issue47-ci-results
            /tmp/trellis-issue47-ci-exports/before/metrics-*
            /tmp/trellis-issue47-ci-exports/after/metrics-*
          if-no-files-found: error
          retention-days: 90
